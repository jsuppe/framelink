plugins { id 'com.android.application' }
android {
 namespace 'dev.framelink.spike'
 compileSdk 34
 ndkVersion '28.2.13676358'
 defaultConfig {
  applicationId 'dev.framelink.spike.broker'
  minSdk 29
  targetSdk 34
  versionCode 1
  versionName '0.1'
  ndk { abiFilters 'arm64-v8a' }
 }
 sourceSets { main { java.srcDirs=['../common/java']; aidl.srcDirs=['../common/aidl'] } }
 buildFeatures { aidl true }
 externalNativeBuild { cmake { path '../CMakeLists.txt'; version '3.22.1' } }
}
