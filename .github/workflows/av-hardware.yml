# Opt-in only. Register trusted GPU machines with the framelink-gpu label first.
# Never run fork PR code automatically on persistent self-hosted machines.
name: A/V native hardware gate
on:
  workflow_dispatch:
permissions:
  contents: read
# Same presets as hosted CI; the hardware test preset selects the native tests.
jobs:
  hardware:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, Linux, X64, framelink-gpu]
          - name: windows
            runner: [self-hosted, Windows, X64, framelink-gpu]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: GStreamer runtime path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          if (!(Test-Path "$root\bin\gstreamer-1.0-0.dll")) { throw 'Configure GStreamer MSVC root on the hardware runner' }
          "$root\bin" >> $env:GITHUB_PATH
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Require A/V test registration
        run: python tools/check_av_test_registration.py build
      - name: Run native A/V tests
        run: ctest --preset hardware
