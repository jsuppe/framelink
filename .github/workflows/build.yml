name: build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One job definition for every platform. Only dependency installation and the
# MSVC environment differ; configure, build, checks and tests come from
# CMakePresets.json and are identical everywhere.
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-26.04
          - name: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ---- platform-specific: dependencies and compiler environment ----------
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgbm-dev libdrm-dev libegl-dev libgles-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-tools
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        id: gst-cache
        with:
          path: gst-msi
          key: framelink-gstreamer-msvc-1.26.11
      - name: Download GStreamer (Windows)
        if: runner.os == 'Windows' && steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory gst-msi -Force | Out-Null
          curl.exe -fLsS -o gst-msi/runtime.msi https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-msvc-x86_64-1.26.11.msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe -fLsS -o gst-msi/devel.msi https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-devel-msvc-x86_64-1.26.11.msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('runtime', 'devel')) {
            $p = Start-Process msiexec -ArgumentList '/i',"$PWD\gst-msi\$name.msi",'/qn','/norestart','ADDLOCAL=ALL' -Wait -PassThru
            if ($p.ExitCode -notin @(0,3010)) { throw "GStreamer $name installation failed: $($p.ExitCode)" }
          }
          $root = @('C:\gstreamer\1.0\msvc_x86_64','C:\Program Files\gstreamer\1.0\msvc_x86_64') | Where-Object { Test-Path "$_\lib\gstreamer-1.0.lib" } | Select-Object -First 1
          if (!$root) { throw 'GStreamer development install not found' }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- identical on every platform ---------------------------------------
      - name: Configure
        run: cmake --preset ci
      - name: Build all targets including A/V fixtures
        run: cmake --build --preset ci
      - name: Validate M6 gate accounting
        run: python tools/test_m6_validation.py
      - name: No machine-local identity in tracked files
        run: python tools/check_local_identity.py
      - name: Require A/V test registration
        run: python tools/check_av_test_registration.py build
      - name: Inspect public GStreamer elements
        run: python tools/check_gst_elements.py build
      - name: Run CPU-only regressions
        run: ctest --preset ci
      - name: Report hardware qualification boundary
        run: echo 'A/V fixtures compiled and registered; GPU-free M5b session/audio tests executed. Native GPU roundtrips and coordinated video require the separate hardware gate (tools/m5b_validation_matrix.py); hosted CI does not execute or qualify them.' >> "$GITHUB_STEP_SUMMARY"
